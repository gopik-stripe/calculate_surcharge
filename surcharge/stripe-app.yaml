$schema: https://stripe.com/stripe-app/v2.0.0/schema
id: com.gopik.surcharge-provider
name: Surcharge Calculator
version: 0.0.1
declarations:
    stripe_api_access: {}
ui_extension:
    views:
        - viewport: stripe.dashboard.home.overview
          component: Home
    content_security_policy:
        purpose: ""
extensions:
    - id: surcharge_calculation
      name: surchage calculation
      interface_id: payments.surcharge_provider
      version: 0.0.1
      permissions: []
      methods:
        calculate_surcharge:
            implementation_type: remote_function
            endpoint_id: calculation
        verify_health:
            implementation_type: remote_function
            endpoint_id: health_check
      endpoints:
        - id: health_check
          type: remote_function
          live:
            url: https://api.gopik.com/api/v1/stripe/surcharge/health-check/live
          managed_sandbox:
            url: https://api.gopik.com/api/v1/stripe/surcharge/health-check/sandbox
          test:
            url: https://api.gopik.com/api/v1/stripe/surcharge/health-check/test
        - id: calculation
          type: remote_function
          live:
            url: https://api.gopik.com/api/v1/stripe/surcharge/calculate/live
          managed_sandbox:
            url: https://api.gopik.com/api/v1/stripe/surcharge/calculate/sandbox
          test:
            url: https://api.gopik.com/api/v1/stripe/surcharge/calculate/test
